name: otel_riverpod
description: OpenTelemetry instrumentation for `package:riverpod`. Adds a
  ProviderObserver that emits short-lived spans for provider add / update /
  fail / dispose events, with semconv-style attributes so you can see your
  state graph in Tempo.
version: 0.1.0-beta.1-wip
repository: https://github.com/dartastic/otel_riverpod
homepage: https://dartastic.io

environment:
  sdk: ^3.0.0

dependencies:
  dartastic_opentelemetry: ^1.1.0-beta.4
  dartastic_opentelemetry_api: ^1.0.0-beta.6
  riverpod: ^3.0.0

dev_dependencies:
  dart_flutter_team_lints: ^3.5.2
  pub_semver: ^2.0.0
  pubspec_parse: ^1.5.0
  test: ^1.26.3
